schema_version = 2
project = "delta_calc"
default_branch = "main"
vision = "A standalone, headless Decimal calculation engine for leveraged crypto trading — salvaged from the retired TradingDashboard app so the rebuild depends on it instead of reimplementing leverage, DCA, and hedging math."

[phases.1]
name = "Extraction"
order = 1
status = "in_progress"

[bundles.calculators]
description = "Port the pure risk/hedging calculators out of the retired TradingDashboard app into DeltaCalc.*"
order = 1
phase = 1

[milestones.v0_1]
name = "Standalone calc engine"
order = 1
status = "active"
target_version = "0.1.0"
description = "Proves the salvaged calculators run standalone (no Phoenix/Ecto/I-O) with their original test suites green, so the TradingDashboard rebuild can depend on DeltaCalc instead of reimplementing the math."

# ---------------------------------------------------------------------------
# Source of truth for ports: the retired app at ~/_DATA/code/TradingDashboard
#   lib/trading_dashboard/risk/{calc,presets,dca_planner,position_calculator}.ex
#   lib/trading_dashboard/portfolio.ex + portfolio/snapshot.ex (hedging formulas)
#   test/trading_dashboard/risk/*.exs (5 test files)
# ---------------------------------------------------------------------------

[[task]]
id = 1
phase = 1
bundle = "calculators"
milestone = "v0_1"
status = "done"
title = "Scaffold delta_calc library"
assignee = "claude"
model = "claude-sonnet-4-6"
scores = { d = 1, b = 5, u = 5 }
markers = ["docs"]
files_to_modify = ["mix.exs", "lib/delta_calc.ex", "README.md", ".tool-versions", ".doctor.exs", ".gitignore"]
body = "Create a standalone Elixir library (no --sup, no Phoenix) for the salvaged calculators: mix.exs with {:decimal, \"~> 2.0\"} + dev/test tooling mirroring the source project (stream_data, credo, dialyxir, doctor, styler, sobelow, ex_unit_json, dialyzer_json, ex_doc); precommit aliases; .tool-versions; README + moduledoc describing the planned API surface; git init for a clean break from the dead project."
implemented = "Scaffolded ~/_DATA/code/delta_calc via `mix new --module DeltaCalc`; customised mix.exs (deps + precommit/precommit.full aliases + dialyzer/coverage config), lib/delta_calc.ex moduledoc (API surface), README, .tool-versions (1.19.1-otp-28 / erlang 28.4), .doctor.exs (hand-written for doctor 0.22 whose gen.config is broken under Elixir 1.20), .gitignore (+priv/plts). `mix compile --warnings-as-errors` clean; `mix test` green; git initialised."
acceptance_criteria = [
  "mix deps.get && mix compile --warnings-as-errors succeeds",
  "mix test passes",
  "git repo initialised at ~/_DATA/code/delta_calc",
]

