- https://docs.deribit.com/api-reference/market-data/public-get_contract_size
- https://docs.deribit.com/api-reference/trading/private-sell
- https://support.deribit.com/hc/en-us/articles/25944751433757-Delta-decay-during-settlement

Dispatch trigger: critical money/risk math and a public calculation contract requiring independent
worked examples.
"""
