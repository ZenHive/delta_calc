schema_version = 2
project = "delta_calc"
default_branch = "main"
vision = "A standalone, headless Decimal engine for leveraged-crypto portfolio decisions — position sizing, liquidation, DCA, funding, hedging, fees, portfolio margin, stress, and options risk — consumed by TradingDashboard instead of reimplementing the math."

[focus]
phase = 3

[phases.1]
name = "Extraction"
order = 1
status = "done"

[bundles.calculators]
description = "Port the pure risk/hedging calculators out of the retired TradingDashboard app into DeltaCalc.*"
order = 1
phase = 1

[milestones.v0_1]
name = "Standalone calc engine"
order = 1
status = "done"
target_version = "0.1.0"
description = "Proves the salvaged calculators run standalone (no Phoenix/Ecto/I-O) with their original test suites green, so the TradingDashboard rebuild can depend on DeltaCalc instead of reimplementing the math."

[phases.2]
name = "Calc primitives"
order = 2
status = "done"

[bundles.calc_primitives]
description = "New pure-Decimal calc primitives the TradingDashboard rebuild's future roadmap needs — hedging engine, per-account/concentration metrics, options + margin-bridge math, funding math. Each is a delta_calc module the dashboard's future tasks consume instead of reimplementing."
order = 2
phase = 2

[milestones.v0_2]
name = "Dashboard calc primitives"
order = 2
status = "done"
target_version = "0.2.0"
description = "Proves TradingDashboard's planned funding, account-risk, options, and margin workflows can consume standalone DeltaCalc primitives instead of embedding formulas. Source of truth: ~/_DATA/code/TradingDashboard/roadmap/phaseN.md specs."

[phases.3]
name = "Consumer decision math"
order = 3
status = "in_progress"

[bundles.consumer_math]
description = "Pure-Decimal decision and aggregation primitives consumed at trading call sites: PnL/breakeven, net-delta hedging, portfolio-margin liquidation, stress scenarios, fees, funding carry, and explicit base-numeraire exposure/coverage. Inputs are caller-owned state plus provider facts; policy, I/O, and option pricing stay outside DeltaCalc."
order = 3
phase = 3

[bundles.contract_hardening]
description = "Cross-module correctness, input/output contracts, independent reference tests, and architecture work that makes the calculation surface trustworthy without adding I/O or portfolio policy."
order = 4
phase = 3

[milestones.v0_3]
name = "Consumer decision primitives"
order = 3
status = "active"
target_version = "0.3.0"
description = "Proves TradingDashboard can consume DeltaCalc as the unit-consistent, independently checked source for everyday leveraged-trading decisions without compensating for hidden venue constants or ambiguous contracts."

[milestones.v0_4]
name = "Base-numeraire covered-call math"
order = 4
status = "pending"
target_version = "0.4.0"
description = "Proves an ETH-numeraire covered-call consumer can calculate inverse exposure and settlement capacity from explicit provider facts while keeping coverage, risk targets, and approval policy separate."

# ---------------------------------------------------------------------------
# Source of truth for ports: the retired app at ~/_DATA/code/TradingDashboard
#   lib/trading_dashboard/risk/{calc,presets,dca_planner,position_calculator}.ex
#   lib/trading_dashboard/portfolio.ex + portfolio/snapshot.ex (hedging formulas)
#   test/trading_dashboard/risk/*.exs (5 test files)
# ---------------------------------------------------------------------------
# CONVENTION (every module-port task): annotate each ported PUBLIC function with a
# Descripex `api(name, desc, opts)` declaration placed immediately BEFORE its `@doc`,
# at port time — never as a backfit pass. Use `:value` vs `:exchange_data` param kinds
# correctly (money/price/leverage inputs are `:value`); keep any hand-written `@doc`
# prose (api/3 overwrites only the prose slot, hints survive). Multi-clause fns: api()
# before the first clause only. See ~/.claude/includes/agent-economy.md.
# ---------------------------------------------------------------------------

