files_to_modify = ["lib/delta_calc/options_risk.ex", "test/delta_calc/options_risk_test.exs"]
touches = ["lib/delta_calc/options_risk.ex"]
assignee = "cursor"
module = "DeltaCalc.OptionsRisk"
model = "composer-2.5-fast"
body = "Audit discovery (audit c695d69). monitor_margin_bridge_health/2 advertises an optional :critical margin threshold via its api() declaration and collects it (@default_critical_threshold 0.45, opts :critical at options_risk.ex:310), but health_status/4 never reads the 4th param (_critical at :375) — the cond only branches on reduce (=> :critical) and warning. health_status type is 3-band and the @doc says 'critical above 35%' (the reduce threshold, 0.35). Net: the :critical option is dead/misleading to agent (Descripex/MCP) consumers — it appears configurable but changes nothing. Resolve the design ambiguity: either add a genuine 4th band that uses the 0.45 critical threshold, or drop the :critical opt + constant and fix the api()/doc to match the real 3-band behavior. Behavior/surface change, so deferred from the hygiene audit rather than guessed."
