schema_version = 2
project = "delta_calc"
default_branch = "main"
vision = "A standalone, headless Decimal calculation engine for leveraged crypto trading — salvaged from the retired TradingDashboard app so the rebuild depends on it instead of reimplementing leverage, DCA, and hedging math."

[phases.1]
name = "Extraction"
order = 1
status = "in_progress"

[bundles.calculators]
description = "Port the pure risk/hedging calculators out of the retired TradingDashboard app into DeltaCalc.*"
order = 1
phase = 1

[milestones.v0_1]
name = "Standalone calc engine"
order = 1
status = "active"
target_version = "0.1.0"
description = "Proves the salvaged calculators run standalone (no Phoenix/Ecto/I-O) with their original test suites green, so the TradingDashboard rebuild can depend on DeltaCalc instead of reimplementing the math."

[phases.2]
name = "Calc primitives"
order = 2
status = "pending"

[bundles.calc_primitives]
description = "New pure-Decimal calc primitives the TradingDashboard rebuild's future roadmap needs — hedging engine, per-account/concentration metrics, options + margin-bridge math, funding math. Each is a delta_calc module the dashboard's future tasks consume instead of reimplementing."
order = 2
phase = 2

[milestones.v0_2]
name = "Dashboard calc primitives"
order = 2
status = "pending"
target_version = "0.2.0"
description = "Build the pure-Decimal calc primitives that TradingDashboard's future roadmap (hedging engine, risk monitoring, options strategy) specifies, so the dashboard consumes DeltaCalc.* rather than reimplementing the math. Source of truth: ~/_DATA/code/TradingDashboard/roadmap/phaseN.md specs."

[phases.3]
name = "Consumer decision math"
order = 3
status = "pending"

[bundles.consumer_math]
description = "Pure-Decimal decision/aggregation primitives the dashboard touches on every screen — PnL/breakeven, net-delta hedging, portfolio-margin liquidation, stress scenarios, fees, funding carry. Value-in/value-out over inputs the consumer already holds (own state + exchange-supplied mark price, funding rate, option deltas). No option pricing — Greeks/IV come from the exchange (Deribit); a Black-Scholes lib is a separate later concern, explicitly out of scope here."
order = 3
phase = 3

[milestones.v0_3]
name = "Consumer decision primitives"
order = 3
status = "pending"
target_version = "0.3.0"
description = "The math the dashboard reaches for at the call-site: position PnL/ROE/breakeven net of fees+funding, net-delta rebalancing from exchange-supplied option deltas, portfolio-margin liquidation across netted positions, price-shock stress scenarios, fee modeling, and funding carry/break-even. Consumer-driven (delta_calc IS the consumer's math layer). Option pricing stays out — exchange supplies Greeks/IV; BS is a future separate lib."

# ---------------------------------------------------------------------------
# Source of truth for ports: the retired app at ~/_DATA/code/TradingDashboard
#   lib/trading_dashboard/risk/{calc,presets,dca_planner,position_calculator}.ex
#   lib/trading_dashboard/portfolio.ex + portfolio/snapshot.ex (hedging formulas)
#   test/trading_dashboard/risk/*.exs (5 test files)
# ---------------------------------------------------------------------------
# CONVENTION (every module-port task): annotate each ported PUBLIC function with a
# Descripex `api(name, desc, opts)` declaration placed immediately BEFORE its `@doc`,
# at port time — never as a backfit pass. Use `:value` vs `:exchange_data` param kinds
# correctly (money/price/leverage inputs are `:value`); keep any hand-written `@doc`
# prose (api/3 overwrites only the prose slot, hints survive). Multi-clause fns: api()
# before the first clause only. See ~/.claude/includes/agent-economy.md.
# ---------------------------------------------------------------------------

